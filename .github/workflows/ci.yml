name: Package and product tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest pipx
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pytest -q
      - run: python scripts/verify_install.py dist/*.whl
