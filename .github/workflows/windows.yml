name: Native Windows
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build pytest pipx
      - run: python -m build
      - name: Install actual wheel
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install --no-deps $wheel
      - name: Native process, pipe, runtime and resource contracts
        run: |
          New-Item -ItemType Directory -Force windows-evidence | Out-Null
          python -m pytest -q --basetemp=windows-evidence/pytest tests/test_windows_platform.py tests/test_windows_runtime.py tests/test_workbench_tasks.py tests/test_workbench_client.py tests/test_workbench_context.py tests/test_installed_package.py tests/test_orca_hosts.py tests/test_orca_context.py tests/test_orca_runtime.py tests/test_orca_transport.py tests/test_orca_receiver.py tests/test_orca_wizard.py tests/test_updater.py tests/test_updater_install.py
      - name: Isolated installed consumer and pinned ARIS helper
        if: ${{ !cancelled() }}
        run: python scripts/verify_install.py 'dist/*.whl'
      - name: Official Herdr Windows distribution
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/herdrdev/herdr/releases/tags/v0.9.5'
          $asset = $release.assets | Where-Object name -eq 'herdr-windows-x86_64.zip'
          $headers = @{ Accept = 'application/octet-stream'; Authorization = "Bearer $env:GH_TOKEN" }
          Invoke-WebRequest $asset.url -Headers $headers -OutFile "$env:RUNNER_TEMP/herdr.zip"
          Expand-Archive "$env:RUNNER_TEMP/herdr.zip" "$env:RUNNER_TEMP/herdr"
          $exe = (Get-ChildItem "$env:RUNNER_TEMP/herdr" -Recurse -Filter herdr.exe | Select-Object -First 1).FullName
          "HERDR_SMOKE_BIN=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Real Herdr, named pipe, ConPTY and no-model report
        if: ${{ !cancelled() && env.HERDR_SMOKE_BIN != '' }}
        run: python scripts/windows_herdr_smoke.py --herdr-bin "$env:HERDR_SMOKE_BIN" --output windows-evidence/herdr-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-evidence
          include-hidden-files: true
          path: windows-evidence/
